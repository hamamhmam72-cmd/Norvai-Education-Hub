  # ── Feedback ──────────────────────────────────────────────────────────────
  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit feedback or a suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
    get:
      operationId: getFeedback
      tags: [feedback]
      summary: List all feedback (admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackWithUser"

  # ── Access Activation ─────────────────────────────────────────────────────
  /access/activate:
    post:
      operationId: activateAccess
      tags: [access]
      summary: Activate app access with a free activation code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateAccessInput"
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessActivationResult"
        "400":
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ── Schemas ───────────────────────────────────────────────────────────────────
components:
  schemas:
    HealthStatus:
      type: object
      required: [status, teamRealtime, teamMessageLimits]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        teamRealtime:
          type: object
          required:
            - websocket
            - pubSubListener
            - reconnectAttempts
            - publishFailures
            - hydrationFailures
          properties:
            websocket:
              type: string
              enum: [healthy]
            pubSubListener:
              type: string
              enum: [connected, disconnected]
            reconnectAttempts:
              type: number
              minimum: 0
            publishFailures:
              type: number
              minimum: 0
            hydrationFailures:
              type: number
              minimum: 0
        teamMessageLimits:
          type: object
          required:
            - storeFailures
          properties:
            storeFailures:
              type: number
              minimum: 0

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    # Auth
    RegisterInput:
      type: object
      required: [username, password, fullName]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        password:
          type: string
          minLength: 8
          maxLength: 72
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9\\s])\\S{8,72}$"
        fullName:
          type: string
          minLength: 2
          maxLength: 80

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, username, fullName, role, setupComplete, createdAt]
      properties:
        id:
          type: number
        username:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [student, admin]
        setupComplete:
          type: boolean
        governorate:
          type: ["string", "null"]
        university:
          type: ["string", "null"]
        major:
          type: ["string", "null"]
        yearOfStudy:
          type: ["number", "null"]
        specialization:
          type: ["string", "null"]
        skillLevel:
          type: ["string", "null"]
        knownLanguages:
          type: array
          items:
            type: string
        avatarUrl:
          type: ["string", "null"]
        accessActivated:
          type: boolean
        trialExpiresAt:
          type: ["string", "null"]
        subscriptionActive:
          type: boolean
        subscriptionExpiry:
          type: ["string", "null"]
        createdAt:
          type: string

    # Profile / Onboarding
    SetupInput:
      type: object
      required: [university, governorate, major, yearOfStudy, specialization]
      properties:
        university:
          type: string
        governorate:
          type: string
        major:
          type: string
        yearOfStudy:
          type: number
        specialization:
          type: string

    ProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
        governorate:
          type: string
        university:
          type: string
        major:
          type: string
        yearOfStudy:
          type: number
        specialization:
          type: string
        skillLevel:
          type: string
        knownLanguages:
          type: array
          items:
            type: string
        avatarUrl:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9\\s])\\S{8,72}$"

    # Dashboard
    DashboardStats:
      type: object
      required: [savedLectures, completedLectures, chatSessions, quizzesTaken, debugSessions, avgQuizScore]
      properties:
        savedLectures:
          type: number
        completedLectures:
          type: number
        chatSessions:
          type: number
        quizzesTaken:
          type: number
        debugSessions:
          type: number
        avgQuizScore:
          type: number

    RecentActivity:
      type: object
      required: [recentLectures, recentChats, recentQuizzes]
      properties:
        recentLectures:
          type: array
          items:
            $ref: "#/components/schemas/Lecture"
        recentChats:
          type: array
          items:
            $ref: "#/components/schemas/ChatSession"
        recentQuizzes:
          type: array
          items:
            $ref: "#/components/schemas/Quiz"

    # Lectures
    Lecture:
      type: object
      required: [id, title, youtubeId, instructor, specialization, difficulty, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        youtubeId:
          type: string
        youtubeUrl:
          type: string
        instructor:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        specialization:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        durationMinutes:
          type: ["number", "null"]
        curriculumId:
          type: ["number", "null"]
        curriculumName:
          type: ["string", "null"]
        isSaved:
          type: boolean
        isCompleted:
          type: boolean
        createdAt:
          type: string

    LectureInput:
      type: object
      required: [title, youtubeUrl, specialization, difficulty]
      properties:
        title:
          type: string
        youtubeUrl:
          type: string
        instructor:
          type: string
        description:
          type: string
        specialization:
          type: string
        difficulty:
          type: string
        durationMinutes:
          type: number
        curriculumId:
          type: number

    LectureUpdate:
      type: object
      properties:
        title:
          type: string
        youtubeUrl:
          type: string
        instructor:
          type: string
        description:
          type: string
        specialization:
          type: string
        difficulty:
          type: string
        durationMinutes:
          type: number
        curriculumId:
          type: ["number", "null"]

    # Curricula
    Curriculum:
      type: object
      required: [id, name, specialization, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        specialization:
          type: string
        lectureCount:
          type: number
        createdAt:
          type: string

    CurriculumInput:
      type: object
      required: [name, specialization]
      properties:
        name:
          type: string
        description:
          type: string
        specialization:
          type: string

    CurriculumUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        specialization:
          type: string

    # Chat
    ChatSession:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: number
        title:
          type: string
        messageCount:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string

    ChatSessionInput:
      type: object
      properties:
        title:
          type: string

    ChatMessage:
      type: object
      required: [id, sessionId, role, content, createdAt]
      properties:
        id:
          type: number
        sessionId:
          type: number
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string

    ChatMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string

    # Summary
    Summary:
      type: object
      required: [id, title, topic, summary, keyPoints, createdAt]
      properties:
        id:
          type: number
        title:
          type: ["string", "null"]
        topic:
          type: string
        originalText:
          type: string
        summary:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        technicalTerms:
          type: array
          items:
            type: string
        difficultyLevel:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string

    SummaryInput:
      type: object
      required: [text, topic]
      properties:
        text:
          type: string
          minLength: 50
        topic:
          type: string
        title:
          type: string

    # Code Debugger
    DebugSession:
      type: object
      required: [id, language, code, status, createdAt]
      properties:
        id:
          type: number
        language:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [clean, has_errors]
        efficiencyScore:
          type: ["number", "null"]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/CodeError"
        explanation:
          type: ["string", "null"]
        bestPractices:
          type: array
          items:
            type: string
        fixedCode:
          type: ["string", "null"]
        createdAt:
          type: string

    CodeError:
      type: object
      required: [line, type, message, fix]
      properties:
        line:
          type: number
        type:
          type: string
        message:
          type: string
        fix:
          type: string

    DebugInput:
      type: object
      required: [code, language]
      properties:
        code:
          type: string
        language:
          type: string

    # Quiz
    Quiz:
      type: object
      required: [id, topic, quizType, questionCount, createdAt]
      properties:
        id:
          type: number
        topic:
          type: string
        quizType:
          type: string
          enum: [multiple_choice, true_false, coding, mixed]
        questionCount:
          type: number
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
        bestScore:
          type: ["number", "null"]
        attemptCount:
          type: number
        createdAt:
          type: string

    QuizQuestion:
      type: object
      required: [id, question, type, options]
      properties:
        id:
          type: number
        question:
          type: string
        type:
          type: string
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: ["string", "null"]
        explanation:
          type: ["string", "null"]

    QuizGenerateInput:
      type: object
      required: [text, quizType, questionCount]
      properties:
        text:
          type: string
        quizType:
          type: string
          enum: [multiple_choice, true_false, coding, mixed]
        questionCount:
          type: number
          minimum: 3
          maximum: 15
        topic:
          type: string

    QuizSubmitInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: string

    QuizResult:
      type: object
      required: [score, totalQuestions, percentage, feedback]
      properties:
        score:
          type: number
        totalQuestions:
          type: number
        percentage:
          type: number
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/QuizFeedback"

    QuizFeedback:
      type: object
      required: [questionId, correct, yourAnswer, correctAnswer]
      properties:
        questionId:
          type: number
        correct:
          type: boolean
        yourAnswer:
          type: string
        correctAnswer:
          type: string
        explanation:
          type: ["string", "null"]

    QuizAttempt:
      type: object
      required: [id, score, percentage, createdAt]
      properties:
        id:
          type: number
        score:
          type: number
        percentage:
          type: number
        createdAt:
          type: string

    # Career
    CareerRecommendation:
      type: object
      required: [careerPaths, learningMap, suggestedLanguages, skillGaps, immediateSteps]
      properties:
        careerPaths:
          type: array
          items:
            $ref: "#/components/schemas/CareerPath"
        learningMap:
          type: array
          items:
            $ref: "#/components/schemas/LearningPhase"
        suggestedLanguages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageSuggestion"
        skillGaps:
          type: array
          items:
            type: string
        immediateSteps:
          type: array
          items:
            type: string

    CareerPath:
      type: object
      required: [title, matchScore, demandLevel, avgSalary, requiredSkills]
      properties:
        title:
          type: string
        matchScore:
          type: number
        demandLevel:
          type: string
          enum: [high, medium, low]
        avgSalary:
          type: string
        requiredSkills:
          type: array
          items:
            type: string

    LearningPhase:
      type: object
      required: [phase, duration, skills, resources]
      properties:
        phase:
          type: string
        duration:
          type: string
        skills:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string

    LanguageSuggestion:
      type: object
      required: [language, priority, reason]
      properties:
        language:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
        reason:
          type: string

    # Subscriptions
    SubscriptionStatus:
      type: object
      required: [active, plan]
      properties:
        active:
          type: boolean
        plan:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
        pendingRequest:
          type: boolean
        pendingRequestDate:
          type: ["string", "null"]

    SubscriptionRequestInput:
      type: object
      required: [plan, accountType, receiptUrl, transferReference, senderName]
      properties:
        plan:
          type: string
          enum: ["3months", "6months", "1year"]
        accountType:
          type: string
          enum: [individual, team, memorization]
        receiptUrl:
          type: string
        transferReference:
          type: string
        senderName:
          type: string

    SubscriptionRequest:
      type: object
      required: [id, userId, plan, status, receiptUrl, createdAt]
      properties:
        id:
          type: number
        userId:
          type: number
        username:
          type: ["string", "null"]
        fullName:
          type: ["string", "null"]
        plan:
          type: string
        accountType:
          type: string
          enum: [individual, team, memorization]
        status:
          type: string
          enum: [pending, approved, rejected]
        receiptUrl:
          type: string
        provider:
          type: string
        transferReference:
          type: ["string", "null"]
        senderName:
          type: ["string", "null"]
        amountFils:
          type: ["number", "null"]
        rejectionReason:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    SubscriptionRejectInput:
      type: object
      properties:
        reason:
          type: string

    # Admin
    AdminStats:
      type: object
      required: [totalUsers, totalLectures, totalQuizzes, activeSubscriptions, pendingSubscriptions]
      properties:
        totalUsers:
          type: number
        totalLectures:
          type: number
        totalQuizzes:
          type: number
        activeSubscriptions:
          type: number
        pendingSubscriptions:
          type: number

    # Progress & Certificates
    ProgressLevel:
      type: object
      required: [points, level, progressPercent, completedLevels, breakdown, newCertificates]
      properties:
        points:
          type: number
        level:
          type: string
          enum: [beginner, intermediate, advanced, expert]
        nextLevel:
          type: ["string", "null"]
        nextLevelPoints:
          type: ["number", "null"]
        progressPercent:
          type: number
        completedLevels:
          type: array
          items:
            type: string
        breakdown:
          type: object
          required: [completedLectures, quizzesTaken, avgQuizScore, debugSessions, chatSessions]
          properties:
            completedLectures:
              type: number
            quizzesTaken:
              type: number
            avgQuizScore:
              type: number
            debugSessions:
              type: number
            chatSessions:
              type: number
        newCertificates:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"

    Certificate:
      type: object
      required: [id, level, certificateNumber, issuedAt]
      properties:
        id:
          type: number
        level:
          type: string
        certificateNumber:
          type: string
        studentName:
          type: string
        issuedAt:
          type: string

    # Feedback
    FeedbackInput:
      type: object
      required: [message]
      properties:
        category:
          type: string
          enum: [suggestion, bug, experience, other]
        message:
          type: string
          minLength: 3
          maxLength: 5000
        rating:
          type: number
          minimum: 1
          maximum: 5

    Feedback:
      type: object
      required: [id, category, message, createdAt]
      properties:
        id:
          type: number
        category:
          type: string
        message:
          type: string
        rating:
          type: ["number", "null"]
        createdAt:
          type: string

    FeedbackWithUser:
      type: object
      required: [id, category, message, createdAt, username, fullName]
      properties:
        id:
          type: number
        category:
          type: string
        message:
          type: string
        rating:
          type: ["number", "null"]
        createdAt:
          type: string
        username:
          type: string
        fullName:
          type: string

    # Access Activation
    ActivateAccessInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    AccessActivationResult:
      type: object
      required: [activated, accessActivated]
      properties:
        activated:
          type: boolean
        accessActivated:
          type: boolean
        trialExpiresAt:
          type: ["string", "null"]
