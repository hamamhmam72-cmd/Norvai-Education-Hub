  /debug/sessions:
    get:
      operationId: getDebugSessions
      tags: [debug]
      summary: List user's debug sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DebugSession"

  /debug/sessions/{id}:
    get:
      operationId: getDebugSession
      tags: [debug]
      summary: Get a single debug session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugSession"

  # ── Quiz Generator ────────────────────────────────────────────────────────
  /quizzes/generate:
    post:
      operationId: generateQuiz
      tags: [quiz]
      summary: Generate quiz from material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizGenerateInput"
      responses:
        "201":
          description: Generated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"

  /quizzes:
    get:
      operationId: getQuizzes
      tags: [quiz]
      summary: List user's quizzes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quiz"

  /quizzes/{id}:
    get:
      operationId: getQuiz
      tags: [quiz]
      summary: Get quiz with questions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"

  /quizzes/{id}/submit:
    post:
      operationId: submitQuiz
      tags: [quiz]
      summary: Submit quiz answers and get results
      parameters:
        - in: path
