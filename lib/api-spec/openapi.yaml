    post:
      operationId: createCurriculum
      tags: [curricula]
      summary: Create curriculum (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"

  /curricula/{id}:
    patch:
      operationId: updateCurriculum
      tags: [curricula]
      summary: Update curriculum (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curriculum"

    delete:
      operationId: deleteCurriculum
      tags: [curricula]
      summary: Delete curriculum (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ── AI Chatbot ────────────────────────────────────────────────────────────
  /chat/sessions:
