  /chat/sessions/{id}/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: List messages in a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"

    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message and get AI reply
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: AI reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  # ── Smart Summary ─────────────────────────────────────────────────────────
  /summaries:
    get:
      operationId: getSummaries
      tags: [summary]
      summary: List user's summaries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Summary"

    post:
      operationId: createSummary
      tags: [summary]
      summary: Generate smart summary from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryInput"
      responses:
        "201":
          description: Generated summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"

  /summaries/{id}:
    get:
      operationId: getSummary
      tags: [summary]
      summary: Get a single summary
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"

    delete:
      operationId: deleteSummary
      tags: [summary]
      summary: Delete a summary
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
